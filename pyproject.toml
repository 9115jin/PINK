[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pink-eval"
dynamic = ["version"]
description = "PINK: over-correction-aware evaluation of handwritten math OCR (EMNLP 2026)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Jin Seong" },
  { name = "Wencke Liermann" },
  { name = "Minho Kim" },
  { name = "Jong-hun Shin" },
  { name = "Soojong Lim" },
]
keywords = ["OCR", "handwritten math", "vision-language models", "evaluation", "LLM-as-a-judge", "over-correction"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21", "pandas>=1.3", "openai>=1.55", "tqdm>=4.0"]

[project.optional-dependencies]
fermat = ["datasets>=2.18"]
dev = ["pytest>=7"]

[project.scripts]
pink = "pink.cli:main"

[project.urls]
Paper = "https://aclanthology.org/2026.emnlp-main.476/"
Code = "https://github.com/9115jin/PINK"

[tool.setuptools.dynamic]
version = { attr = "pink.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
